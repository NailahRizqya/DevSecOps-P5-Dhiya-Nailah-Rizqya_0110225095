name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Prinsip least privilege: workflow hanya boleh membaca isi repository.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  COVERAGE_THRESHOLD: "80"

jobs:
  # ---------------------------------------------------------------
  # JOB 1 - BUILD: install dependency, unit test, dan quality gate coverage
  # ---------------------------------------------------------------
  build:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests + coverage gate
        # Pipeline GAGAL bila coverage < COVERAGE_THRESHOLD (Quality Gate #1)
        run: |
          pytest --cov=app --cov=scripts \
                 --cov-report=term-missing \
                 --cov-report=xml \
                 --cov-fail-under=${{ env.COVERAGE_THRESHOLD }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------
  # JOB 2 - SAST: analisis statis dengan Bandit + Security Quality Gate
  # ---------------------------------------------------------------
  sast-scan:
    name: SAST Scan (Bandit)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit==1.7.10

      - name: Run Bandit (generate reports)
        # --exit-zero: Bandit hanya membuat laporan; keputusan lulus/gagal
        # diambil oleh langkah Quality Gate di bawah.
        run: |
          bandit -r app run.py -f json -o bandit-report.json --exit-zero
          bandit -r app run.py -f txt  -o bandit-report.txt  --exit-zero

      - name: Security Quality Gate
        # Gagal bila ada temuan HIGH/MEDIUM, atau LOW > 5 (Quality Gate #2)
        run: |
          python scripts/quality_gate.py bandit-report.json \
            --max-high 0 --max-medium 0 --max-low 5 | tee quality-gate.txt
          exit "${PIPESTATUS[0]}"
        shell: bash

      - name: Publish summary to GitHub Actions
        if: always()
        run: |
          {
            echo "### Bandit SAST Result"
            echo '```'
            cat quality-gate.txt 2>/dev/null || echo "Quality gate tidak berjalan."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-reports
          path: |
            bandit-report.json
            bandit-report.txt
            quality-gate.txt
          if-no-files-found: ignore
